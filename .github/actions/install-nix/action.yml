name: install Nix

inputs:
  cachixAuthToken:
    description: auth token for https://app.cachix.org/cache/rvolosatovs

permissions:
  id-token: write
  contents: read

runs:
  using: composite
  steps:
  - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
    with:
      extra-conf: |
        accept-flake-config = true

  - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
    continue-on-error: true
    with:
      name: nixify
      authToken: '${{ inputs.cachixAuthToken }}'
